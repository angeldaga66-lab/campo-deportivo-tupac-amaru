<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--green:#06251d;--green2:#0b3a2e;--accent:#00d37a;--red:#ef4444;--yellow:#f59e0b;--bg:#f4f7f6;--card:#fff;--text:#10201b;--muted:#6b7773;--line:#dce5e1}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--green);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5}header img{height:52px;max-width:250px;object-fit:contain}header .right{display:flex;align-items:center;gap:12px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#001b11}.dark{background:#173e33;color:#fff}.danger{background:#fee2e2;color:#991b1b}.ghost{background:#eef3f1;color:#173e33}
main{max-width:1450px;margin:auto;padding:22px}.login{max-width:430px;margin:70px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 35px #0b3a2e18}.login h1{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}.topbar h1{margin:0 0 5px}.muted{color:var(--muted)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow:auto}.day{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:130px;overflow:hidden}.dayhead{padding:12px;background:#edf4f1;border-bottom:1px solid var(--line);font-weight:800}.dayhead small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.slot{padding:7px;border-bottom:1px solid #edf1ef;min-height:62px}.slot:last-child{border-bottom:0}.time{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:11px;padding:4px 6px;border-radius:6px;font-weight:700}.free{color:#16824f;background:#e5f8ee}.busy{color:#9b2226;background:#fee8e7}.pending{color:#915d00;background:#fff3d4}.confirmed{color:#11623e;background:#dff8eb}.cancelled{color:#777;background:#eee}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font-size:24px;display:block;margin-top:5px}.section{background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:18px;overflow:hidden}.section h2{font-size:18px;margin:0;padding:16px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px;border-bottom:1px solid #edf1ef;text-align:left;font-size:13px}th{background:#f6f9f8}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}.modal{position:fixed;inset:0;background:#00140f99;display:flex;align-items:flex-start;justify-content:center;padding:18px;z-index:20;overflow-y:auto;box-sizing:border-box}.modalbox{background:#fff;border-radius:18px;max-width:560px;width:100%;height:calc(100vh - 36px);max-height:calc(100vh - 36px);padding:22px;overflow-y:auto;box-sizing:border-box;flex:0 1 auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.error{color:#a61b1b;background:#fff0f0;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
@media(max-width:850px){.week{grid-template-columns:repeat(7,150px)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<style id="reservation-card-styles">
.reservation-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.reservation-card-detail{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;background:rgba(0,0,0,.18)}
.reservation-card-detail h4{margin:0 0 10px;font-size:17px}
.reservation-card-detail .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.reservation-card-detail .detail-item{font-size:13px}
.reservation-card-detail .detail-item strong{display:block;font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.reservation-card-detail .detail-total{font-size:20px;font-weight:800;margin-top:12px}

</head>
<body>
<header><img src="logo.png" alt="Campo Deportivo Túpac Amaru"><div class="right"><span id="userEmail"></span><button id="logout" class="dark hidden">Cerrar sesión</button></div></header>
<section id="loginView" class="login"><h1>Panel de administración</h1><p class="muted">Ingresa con tu cuenta de administrador.</p><div class="field"><label>Correo</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="primary" style="width:100%">Ingresar</button><div id="loginError" class="error hidden"></div></section>
<main id="app" class="hidden">
<div class="topbar"><div><h1>Agenda de reservas</h1><div id="weekLabel" class="muted"></div></div><div class="controls"><button id="prev" class="ghost">← Semana anterior</button><button id="today" class="dark">Hoy</button><button id="next" class="ghost">Semana siguiente →</button><button id="newBtn" class="primary">+ Nueva reserva</button></div></div>
<div class="stats"><div class="stat">Reservas <b id="statReservations">0</b></div><div class="stat">Confirmadas <b id="statConfirmed">0</b></div><div class="stat">Pendientes <b id="statPending">0</b></div><div class="stat">Total semana <b id="statTotal">S/ 0</b></div></div>
<div id="week" class="week"></div>
<div class="section"><h2>Reservas de la semana</h2><div class="tablewrap">
<div id="reservationFilters" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0;">
<label style="display:flex;flex-direction:column;gap:5px;font-size:13px;"><span>Fecha</span><input id="filterDate" type="date"></label>
<label style="display:flex;flex-direction:column;gap:5px;font-size:13px;"><span>Campo</span><select id="filterField">
<option value="">Todos los campos</option><option value="Fútbol 7|1">Fútbol 7 · Campo 1</option><option value="Fútbol 7|2">Fútbol 7 · Campo 2</option><option value="Fútbol 7|3">Fútbol 7 · Campo 3</option><option value="Fútbol 7|4">Fútbol 7 · Campo 4</option><option value="Fútbol 9|5">Fútbol 9 · Campo 5</option><option value="Fútbol 9|6">Fútbol 9 · Campo 6</option><option value="Fútbol 11|7">Fútbol 11 · Campo 7</option>
</select></label>
<label style="display:flex;flex-direction:column;gap:5px;font-size:13px;"><span>Estado</span><select id="filterStatus">
<option value="">Todos los estados</option><option value="pending">Pendiente</option><option value="confirmed">Confirmada</option><option value="cancelled">Cancelada</option><option value="no_show">No se presentó</option>
</select></label>
<button type="button" id="clearReservationFilters" class="btn" style="align-self:end;">Limpiar filtros</button>
</div>
<table><thead><tr><th>Fecha</th><th>Cliente</th><th>Campo</th><th>Horario</th><th>Total</th><th>Pago</th><th>Estado</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Nueva reserva</h2><button id="close" class="ghost">✕</button></div>
<div class="field"><label>Nombre del cliente</label><input id="rName"></div><div class="field"><label>Celular</label><input id="rPhone"></div><div class="field"><label>Campo</label><select id="rField"><option value="7|1|Fútbol 7">Fútbol 7 · Campo 1</option><option value="7|2|Fútbol 7">Fútbol 7 · Campo 2</option><option value="7|3|Fútbol 7">Fútbol 7 · Campo 3</option><option value="7|4|Fútbol 7">Fútbol 7 · Campo 4</option><option value="9|5|Fútbol 9">Fútbol 9 · Campo 5</option><option value="9|6|Fútbol 9">Fútbol 9 · Campo 6</option><option value="11|7|Fútbol 11">Fútbol 11 · Campo 7</option></select></div><div class="field"><label>Fecha</label><input id="rDate" type="date"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Inicio</label><input id="rStart" type="time" step="1800"></div><div class="field"><label>Fin</label><input id="rEnd" type="time" step="1800"></div></div><div class="field"><label>Estado</label><select id="rStatus"><option value="pending">Pendiente</option><option value="confirmed">Confirmada</option><option value="cancelled">Cancelada</option><option value="no_show">No se presentó</option></select></div><div class="field"><label>Pago</label><select id="rPayment"><option value="pending">Pendiente</option><option value="yape">Yape</option><option value="plin">Plin</option><option value="cash">Efectivo</option><option value="other">Otro</option></select></div><div class="field"><label>Notas</label><textarea id="rNotes" rows="3"></textarea></div><div id="formError" class="error hidden"></div><div class="actions"><button id="cancel" class="ghost">Cancelar</button><button id="save" class="primary">Guardar reserva</button></div></div></div>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);let current=new Date();current.setHours(0,0,0,0);let reservations=[];let editingId=null;
const $=id=>document.getElementById(id);function monday(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}function iso(d){return d.toISOString().slice(0,10)}function money(n){return 'S/ '+Number(n||0).toFixed(0)}
function hourlyPrice(fieldType,time){const night=String(time||'').slice(0,5)>='18:00';let p=fieldType==='Fútbol 7'?(night?80:70):fieldType==='Fútbol 9'?(night?160:140):(night?320:280);return p}
function reservationTotal(fieldType,date,start,end){const d=new Date(date+'T12:00:00');const monday=d.getDay()===1;let cur=start.slice(0,5),finish=end.slice(0,5),total=0;while(cur<finish){let rate=hourlyPrice(fieldType,cur);if(monday)rate=Math.max(0,rate-10);total+=rate/2;let [h,m]=cur.split(':').map(Number);m+=30;if(m>=60){h++;m-=60}cur=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}return total}
function fieldLabel(r){return `${r.field_type} · Campo ${r.field_number}`}
function conflicts(type,num){if(type==='Fútbol 11')return [[7,1],[7,2],[7,3],[7,4],[9,5],[9,6],[11,7]];if(type==='Fútbol 9'&&num===5)return [[7,1],[7,2],[9,5],[11,7]];if(type==='Fútbol 9'&&num===6)return [[7,3],[7,4],[9,6],[11,7]];if(type==='Fútbol 7'&&(num===1||num===2))return [[7,num],[9,5],[11,7]];if(type==='Fútbol 7'&&(num===3||num===4))return [[7,num],[9,6],[11,7]];return [[Number(type.replace(/\D/g,'')),num]]}
function overlaps(a,b){return a.start_time<b.end_time&&a.end_time>b.start_time}
function render(){const m=monday(current),days=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);days.push(d)}$('weekLabel').textContent=`${days[0].toLocaleDateString('es-PE',{day:'2-digit',month:'short'})} – ${days[6].toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'})}`;const active=reservations.filter(r=>r.status!=='cancelled');$('statReservations').textContent=active.length;$('statConfirmed').textContent=active.filter(r=>r.status==='confirmed').length;$('statPending').textContent=active.filter(r=>r.status==='pending').length;$('statTotal').textContent=money(active.reduce((s,r)=>s+Number(r.total||0),0));$('week').innerHTML='';days.forEach(d=>{const col=document.createElement('div');col.className='day';col.innerHTML=`<div class="dayhead">${d.toLocaleDateString('es-PE',{weekday:'long'})}<small>${d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit'})}</small></div>`;for(let h=6;h<24;h++){for(let min=0;min<60;min+=30){const st=`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}:00`;const en=h===23&&min===30?'24:00:00':`${String(min===30?h+1:h).padStart(2,'0')}:${min===30?'00':'30'}:00`;const date=iso(d);const rr=active.filter(r=>r.reservation_date===date&&r.start_time<en&&r.end_time>st);const slot=document.createElement('div');slot.className='slot';slot.innerHTML=`<div class="time">${st.slice(0,5)}</div><div class="chips">${rr.length?rr.map(r=>`<span class="chip ${r.status}">${r.field_number} · ${r.customer_name||'Reserva'}</span>`).join(''):'<span class="chip free">Libre</span>'}</div>`;col.appendChild(slot)}}$('week').appendChild(col)});$('rows').innerHTML=active.sort((a,b)=>(a.reservation_date+a.start_time).localeCompare(b.reservation_date+b.start_time)).map(r=>`<tr><td>${new Date(r.reservation_date+'T12:00').toLocaleDateString('es-PE')}</td><td><b>${r.customer_name}</b><br>${r.customer_phone||''}</td><td>${fieldLabel(r)}</td><td>${r.start_time.slice(0,5)}–${r.end_time.slice(0,5)}</td><td>${money(r.total)}</td><td>${r.payment_method||'Pendiente'}</td><td><span class="pill ${r.status}">${({pending:'Pendiente',confirmed:'Confirmada',cancelled:'Cancelada',no_show:'No se presentó'}[r.status]||r.status)}</span></td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="ghost edit" data-id="${r.id}">Editar</button>${r.status!=='cancelled'?`<button class="danger cancel-res" data-id="${r.id}">Cancelar</button>`:''}</div></td></tr>`).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editReservation(b.dataset.id));document.querySelectorAll('.cancel-res').forEach(b=>b.onclick=()=>cancelReservation(b.dataset.id))}
async function load(){const m=monday(current),to=new Date(m);to.setDate(m.getDate()+7);const {data,error}=await sb.from('reservations').select('*').gte('reservation_date',iso(m)).lt('reservation_date',iso(to)).order('reservation_date').order('start_time');if(error){alert(error.message);return}reservations=(data||[]).map(r=>({...r,total:Number(r.total||0)}));render()}
function openModal(r){editingId=r?.id||null;$('modalTitle').textContent=editingId?'Editar reserva':'Nueva reserva';$('rName').value=r?.customer_name||'';$('rPhone').value=r?.customer_phone||'';$('rDate').value=r?.reservation_date||iso(current);$('rStart').value=(r?.start_time||'18:00').slice(0,5);$('rEnd').value=(r?.end_time||'19:00').slice(0,5);$('rStatus').value=r?.status||'pending';$('rPayment').value=r?.payment_method||'pending';$('rNotes').value=r?.notes||'';$('formError').classList.add('hidden');$('modal').classList.remove('hidden')}
function editReservation(id){openModal(reservations.find(r=>String(r.id)===String(id)))}
async function cancelReservation(id){const r=reservations.find(x=>String(x.id)===String(id));if(!r)return;if(!confirm(`¿Cancelar la reserva de ${r.customer_name||'este cliente'} en ${fieldLabel(r)} de ${r.start_time.slice(0,5)} a ${r.end_time.slice(0,5)}?`))return;const {error}=await sb.from('reservations').update({status:'cancelled'}).eq('id',id);if(error){alert('No se pudo cancelar la reserva: '+error.message);return}await load();alert('Reserva cancelada. El horario quedó liberado para nuevas reservas.')}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent=error.message;$('loginError').classList.remove('hidden')}};$('logout').onclick=()=>sb.auth.signOut();$('prev').onclick=()=>{current.setDate(current.getDate()-7);load()};$('next').onclick=()=>{current.setDate(current.getDate()+7);load()};$('today').onclick=()=>{current=new Date();current.setHours(0,0,0,0);load()};$('newBtn').onclick=()=>openModal();$('close').onclick=$('cancel').onclick=()=>$('modal').classList.add('hidden');
$('save').onclick=async()=>{const [ft,fn,fname]=$('rField').value.split('|');const d=$('rDate').value,st=$('rStart').value+':00',en=$('rEnd').value+':00';if(!d||!$('rName').value||st>=en){$('formError').textContent='Completa nombre, fecha y un horario válido.';$('formError').classList.remove('hidden');return}const base={customer_name:$('rName').value,customer_phone:$('rPhone').value,field_type:ft==='7'?'Fútbol 7':ft==='9'?'Fútbol 9':'Fútbol 11',field_number:Number(fn),reservation_date:d,start_time:st,end_time:en,status:$('rStatus').value,payment_method:$('rPayment').value,notes:$('rNotes').value,total:reservationTotal(ft==='7'?'Fútbol 7':ft==='9'?'Fútbol 9':'Fútbol 11',d,st,en)};let q=editingId?sb.from('reservations').update(base).eq('id',editingId):sb.from('reservations').insert(base);const {error}=await q;if(error){$('formError').textContent=error.message;$('formError').classList.remove('hidden');return}$('modal').classList.add('hidden');await load()};
(async()=>{const {data}=await sb.auth.getSession();if(data.session){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('userEmail').textContent=data.session.user.email;load()}})();sb.auth.onAuthStateChange((_e,s)=>{if(s){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('userEmail').textContent=s.user.email;load()}else{$('loginView').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}});
</script><script>
(function(){
function n(v){return String(v||"").trim().toLowerCase();}
function applyFilters(){
 const date=document.getElementById("filterDate")?.value||"";
 const field=document.getElementById("filterField")?.value||"";
 const status=document.getElementById("filterStatus")?.value||"";
 const nodes=[...document.querySelectorAll("table tbody tr, .reservation-row, .reservation-card, .reservation-item, [data-reservation-row]")];
 nodes.forEach(el=>{
   const text=n(el.innerText||"");
   const d=el.dataset.date||el.getAttribute("data-date")||"";
   const ft=el.dataset.fieldType||el.getAttribute("data-field-type")||"";
   const fn=el.dataset.fieldNumber||el.getAttribute("data-field-number")||"";
   const st=el.dataset.status||el.getAttribute("data-status")||"";
   let ok=true;
   if(date){ ok=d ? d===date : text.includes(n(new Date(date+"T12:00:00").toLocaleDateString("es-PE"))); }
   if(ok&&field){const [a,b]=field.split("|"); ok=(ft||fn)?n(ft)===n(a)&&String(fn)===b:(text.includes(n(a))&&text.includes("campo "+b));}
   if(ok&&status){const labels={pending:["pendiente"],confirmed:["confirmada","confirmado"],cancelled:["cancelada","cancelado"],no_show:["no se presentó","no se presento"]}; ok=st?n(st)===n(status):(labels[status]||[]).some(x=>text.includes(x));}
   el.style.display=ok?"":"none";
 });
}
function bind(){
 ["filterDate","filterField","filterStatus"].forEach(id=>document.getElementById(id)?.addEventListener("change",applyFilters));
 document.getElementById("clearReservationFilters")?.addEventListener("click",()=>{["filterDate","filterField","filterStatus"].forEach(id=>{let e=document.getElementById(id);if(e)e.value=""});applyFilters();});
 setTimeout(applyFilters,300);setTimeout(applyFilters,1000);
}
document.addEventListener("DOMContentLoaded",bind);
window.applyReservationFilters=applyFilters;
})();
</script>
<script id="reservation-detail-cards">
(function(){
  function esc(v){
    return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function getText(row, labels){
    const cells=[...row.querySelectorAll("td")].map(x=>(x.innerText||"").trim());
    const text=cells.join(" | ");
    for(const label of labels){
      const m=text.match(new RegExp(label+"\\s*:?\\s*([^|\\n]+)","i"));
      if(m) return m[1].trim();
    }
    return "";
  }
  function buildCards(){
    const table=document.querySelector("table");
    if(!table) return;
    const rows=[...table.querySelectorAll("tbody tr")];
    if(!rows.length) return;

    let host=document.getElementById("reservationDetailCards");
    if(!host){
      host=document.createElement("div");
      host.id="reservationDetailCards";
      host.className="reservation-cards";
      table.parentNode.insertBefore(host,table);
    }
    host.innerHTML="";

    rows.forEach((row,i)=>{
      const cells=[...row.querySelectorAll("td")].map(x=>(x.innerText||"").trim());
      if(!cells.length) return;
      const joined=cells.join(" | ");

      const value=(labels)=>getText(row,labels) || "";
      const cliente=value(["cliente","nombre"]);
      const telefono=value(["tel[eé]fono","tel"]);
      const campo=value(["campo"]);
      const fecha=value(["fecha"]);
      const horario=value(["horario"]);
      const duracion=value(["duraci[oó]n"]);
      const total=value(["total"]);
      const pago=value(["forma de pago","pago","m[eé]todo de pago"]);
      const observaciones=value(["observaciones","notas"]);
      const estado=value(["estado"]);

      // If the existing table is positional rather than label-based, preserve
      // its values in the card as a fallback.
      const vals=[cliente,telefono,campo,fecha,horario,duracion,total,pago,observaciones,estado];
      const fallback=vals.map((v,j)=>v||cells[j]||"—");

      const card=document.createElement("article");
      card.className="reservation-card-detail";
      card.dataset.reservationRow="true";
      card.dataset.date=row.dataset.date||"";
      card.dataset.fieldType=row.dataset.fieldType||"";
      card.dataset.fieldNumber=row.dataset.fieldNumber||"";
      card.dataset.status=row.dataset.status||"";

      card.innerHTML=
        "<h4>Reserva #"+(i+1)+"</h4>"+
        '<div class="detail-grid">'+
        '<div class="detail-item"><strong>Cliente</strong>'+esc(fallback[0])+'</div>'+
        '<div class="detail-item"><strong>Teléfono</strong>'+esc(fallback[1])+'</div>'+
        '<div class="detail-item"><strong>Campo</strong>'+esc(fallback[2])+'</div>'+
        '<div class="detail-item"><strong>Fecha</strong>'+esc(fallback[3])+'</div>'+
        '<div class="detail-item"><strong>Horario</strong>'+esc(fallback[4])+'</div>'+
        '<div class="detail-item"><strong>Duración</strong>'+esc(fallback[5])+'</div>'+
        '<div class="detail-item"><strong>Forma de pago</strong>'+esc(fallback[7])+'</div>'+
        '<div class="detail-item"><strong>Estado</strong>'+esc(fallback[9])+'</div>'+
        '<div class="detail-item detail-notes"><strong>Observaciones</strong>'+esc(fallback[8])+'</div>'+
        '</div>'+
        '<div class="detail-total">Total: '+esc(fallback[6])+'</div>';

      // Copy existing action buttons (edit/delete) into the card.
      const actions=[...row.querySelectorAll("button,a")].filter(x=>/editar|edit|eliminar|delete/i.test(x.innerText||""));
      if(actions.length){
        const box=document.createElement("div");
        box.style.cssText="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap";
        actions.forEach(a=>box.appendChild(a.cloneNode(true)));
        card.appendChild(box);
      }
      host.appendChild(card);
    });

    // Keep the original table hidden; cards are the single source of visual detail.
    table.style.display="none";
  }

  function refresh(){
    setTimeout(buildCards,80);
    setTimeout(buildCards,400);
    setTimeout(buildCards,900);
  }

  document.addEventListener("DOMContentLoaded",refresh);
  window.addEventListener("load",refresh);

  // Observe changes to the reservation table so cards update after Supabase renders.
  const obs=new MutationObserver(refresh);
  const start=()=>{ const t=document.querySelector("table"); if(t) obs.observe(t,{childList:true,subtree:true}); };
  setTimeout(start,300);
})();
</script>
</body></html>
